name: Bug report / Probleem melden
description: Report a reproducible problem in Heimora
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "This report is public. Never include passwords, tokens, database files, audit logs or private connection details. Report security vulnerabilities privately using SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Heimora version / Versie
      placeholder: "0.7.1"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened? / Wat ging er mis?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Stappen om te herhalen
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / Verwacht resultaat
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows-versie
